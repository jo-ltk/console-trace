services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports:
      - "5432:5432"
    volumes:
      - trace_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "server/src/api/index.ts"]
    environment:
      DATABASE_URL: postgres://trace:trace@postgres:5432/trace
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_BASE_URL: http://localhost:3001
      ALLOW_LOCAL_TARGETS: "false"
      ARTIFACT_DIR: /app/artifacts
      SCAN_MAX_PAGES: "20"
      SCAN_HARD_MAX_PAGES: "100"
      SCAN_MAX_DEPTH: "3"
      SCAN_MAX_DURATION: "180000"
      SCAN_PAGE_TIMEOUT: "30000"
      SCAN_MAX_REQUESTS: "500"
      SCAN_BROWSER_CONCURRENCY: "1"
      SCAN_MAX_SCREENSHOT_BYTES: "8000000"
      SCAN_MAX_RESPONSE_BODY_BYTES: "1048576"
      SCAN_PROBE_MAX_REQUESTS: "50"
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - trace_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "server/src/worker/index.ts"]
    environment:
      DATABASE_URL: postgres://trace:trace@postgres:5432/trace
      REDIS_URL: redis://redis:6379
      ALLOW_LOCAL_TARGETS: "false"
      SCAN_BROWSER_CONCURRENCY: "1"
      ARTIFACT_DIR: /app/artifacts
      SCAN_MAX_PAGES: "20"
      SCAN_HARD_MAX_PAGES: "100"
      SCAN_MAX_DEPTH: "3"
      SCAN_MAX_DURATION: "180000"
      SCAN_PAGE_TIMEOUT: "30000"
      SCAN_MAX_REQUESTS: "500"
      SCAN_MAX_SCREENSHOT_BYTES: "8000000"
      SCAN_MAX_RESPONSE_BODY_BYTES: "1048576"
      SCAN_PROBE_MAX_REQUESTS: "50"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - trace_artifacts:/app/artifacts
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  trace_pg:
  trace_artifacts:
