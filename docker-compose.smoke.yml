# Smoke-test compose: uses host networking because bridge networking
# may be unavailable in some cloud VM environments (no overlay/iptables).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    command: ["npx", "tsx", "server/src/api/index.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://trace:trace@127.0.0.1:5432/trace
      REDIS_URL: redis://127.0.0.1:6379
      API_PORT: 3001
      CORS_ORIGINS: "*"
      ALLOW_LOCAL_TARGETS: "false"
      ARTIFACT_DIR: /app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - trace_artifacts:/app/artifacts

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    command: ["npx", "tsx", "server/src/worker/index.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://trace:trace@127.0.0.1:5432/trace
      REDIS_URL: redis://127.0.0.1:6379
      ALLOW_LOCAL_TARGETS: "false"
      SCAN_BROWSER_CONCURRENCY: "1"
      ARTIFACT_DIR: /app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    shm_size: "1gb"
    volumes:
      - trace_artifacts:/app/artifacts

volumes:
  trace_artifacts:
