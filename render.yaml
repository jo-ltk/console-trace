# TRACE production stack — Render Blueprint (free tier)
# Deploy: https://render.com/deploy?repo=https://github.com/jo-ltk/console-trace
#
# Render has NO free background workers. API + BullMQ worker run together in one
# free web service via docker/start-stack.sh (same scan pipeline as docker-compose).
#
# Free-tier caveats (honest):
# - Web: 512 MB RAM, spins down after 15 min idle, 750 instance-hours/month
# - Postgres: 256 MB, 1 GB storage, expires 30 days after creation
# - Redis (Key Value): 25 MB, in-memory only (queue state lost on restart)
# - Playwright on 512 MB is tight; simple scans work; complex sites may OOM
#
# Secrets are injected by Render; never commit credentials.

databases:
  - name: trace-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: trace
    user: trace

services:
  - type: keyvalue
    name: trace-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: trace-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: sh docker/start-stack.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trace-redis
          property: connectionString
      - key: API_PORT
        fromService:
          type: web
          name: trace-api
          envVarKey: PORT
      - key: API_BASE_URL
        fromService:
          type: web
          name: trace-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOW_LOCAL_TARGETS
        value: "false"
      - key: ARTIFACT_DIR
        value: /tmp/artifacts
      - key: SCAN_MAX_PAGES
        value: "20"
      - key: SCAN_HARD_MAX_PAGES
        value: "100"
      - key: SCAN_MAX_DEPTH
        value: "3"
      - key: SCAN_MAX_DURATION
        value: "180000"
      - key: SCAN_PAGE_TIMEOUT
        value: "30000"
      - key: SCAN_MAX_REQUESTS
        value: "500"
      - key: SCAN_BROWSER_CONCURRENCY
        value: "1"
      - key: SCAN_MAX_SCREENSHOT_BYTES
        value: "8000000"
      - key: SCAN_MAX_RESPONSE_BODY_BYTES
        value: "1048576"
      - key: SCAN_PROBE_MAX_REQUESTS
        value: "50"
      - key: LOG_LEVEL
        value: info
