# TRACE production — Render Blueprint
# Separate persistent API + Playwright worker (not serverless, not colocated).
#
# Worker plan is standard (2 GB) because Chromium will OOM on 512 MB starter.
# Postgres basic-1gb: free instances expire. Redis noeviction: BullMQ keys must not be LRU-evicted.
#
# Apply from the Render Dashboard → New → Blueprint, using this repo.
# Secrets are injected by Render; never commit credentials.

databases:
  - name: trace-db
    plan: basic-1gb
    postgresMajorVersion: "16"
    databaseName: trace
    user: trace
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: trace-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: trace-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: npx tsx server/src/api/index.ts
    healthCheckPath: /health
    autoDeploy: true
    maxShutdownDelaySeconds: 30
    envVars:
      - fromGroup: trace-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: trace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trace-redis
          property: connectionString
      - key: API_BASE_URL
        fromService:
          type: web
          name: trace-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: worker
    name: trace-worker
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: npx tsx server/src/worker/index.ts
    autoDeploy: true
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: trace-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: trace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trace-redis
          property: connectionString

envVarGroups:
  - name: trace-runtime
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: ALLOW_LOCAL_TARGETS
        value: "false"
      - key: CORS_ORIGINS
        value: "https://trace-inspector.expo.app"
      - key: ARTIFACT_DIR
        value: /tmp/artifacts
      - key: SCAN_MAX_PAGES
        value: "5"
      - key: SCAN_HARD_MAX_PAGES
        value: "10"
      - key: SCAN_MAX_DEPTH
        value: "1"
      - key: SCAN_MAX_DURATION
        value: "180000"
      - key: SCAN_PAGE_TIMEOUT
        value: "30000"
      - key: SCAN_MAX_REQUESTS
        value: "100"
      - key: SCAN_MAX_CONSOLE_EVENTS
        value: "200"
      - key: SCAN_MAX_RUNTIME_ERRORS
        value: "100"
      - key: SCAN_BROWSER_CONCURRENCY
        value: "1"
      - key: SCAN_SCREENSHOTS_ENABLED
        value: "false"
      - key: SCAN_MAX_SCREENSHOT_BYTES
        value: "512000"
      - key: SCAN_MAX_RESPONSE_BODY_BYTES
        value: "32768"
      - key: SCAN_PROBE_MAX_REQUESTS
        value: "20"
      - key: LOG_LEVEL
        value: info
