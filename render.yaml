# TRACE production stack — Render Blueprint
# Deploy: https://render.com/deploy?repo=https://github.com/jo-ltk/console-trace
#
# Services: HTTPS API, Playwright worker, managed PostgreSQL, managed Redis.
# Secrets are injected by Render (DATABASE_URL, REDIS_URL); never commit credentials.

databases:
  - name: trace-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: trace
    user: trace

services:
  - type: keyvalue
    name: trace-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: trace-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: npx tsx server/src/api/index.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trace-redis
          property: connectionString
      - key: API_PORT
        fromService:
          type: web
          name: trace-api
          envVarKey: PORT
      - key: API_BASE_URL
        fromService:
          type: web
          name: trace-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOW_LOCAL_TARGETS
        value: "false"
      - key: ARTIFACT_DIR
        value: /app/artifacts
      - key: SCAN_MAX_PAGES
        value: "20"
      - key: SCAN_HARD_MAX_PAGES
        value: "100"
      - key: SCAN_MAX_DEPTH
        value: "3"
      - key: SCAN_MAX_DURATION
        value: "180000"
      - key: SCAN_PAGE_TIMEOUT
        value: "30000"
      - key: SCAN_MAX_REQUESTS
        value: "500"
      - key: SCAN_BROWSER_CONCURRENCY
        value: "1"
      - key: SCAN_MAX_SCREENSHOT_BYTES
        value: "8000000"
      - key: SCAN_MAX_RESPONSE_BODY_BYTES
        value: "1048576"
      - key: SCAN_PROBE_MAX_REQUESTS
        value: "50"
      - key: LOG_LEVEL
        value: info

  - type: worker
    name: trace-worker
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: npx tsx server/src/worker/index.ts
    autoDeploy: true
    disk:
      name: trace-artifacts
      mountPath: /app/artifacts
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trace-redis
          property: connectionString
      - key: ALLOW_LOCAL_TARGETS
        value: "false"
      - key: SCAN_BROWSER_CONCURRENCY
        value: "1"
      - key: ARTIFACT_DIR
        value: /app/artifacts
      - key: SCAN_MAX_PAGES
        value: "20"
      - key: SCAN_HARD_MAX_PAGES
        value: "100"
      - key: SCAN_MAX_DEPTH
        value: "3"
      - key: SCAN_MAX_DURATION
        value: "180000"
      - key: SCAN_PAGE_TIMEOUT
        value: "30000"
      - key: SCAN_MAX_REQUESTS
        value: "500"
      - key: SCAN_MAX_SCREENSHOT_BYTES
        value: "8000000"
      - key: SCAN_MAX_RESPONSE_BODY_BYTES
        value: "1048576"
      - key: SCAN_PROBE_MAX_REQUESTS
        value: "50"
      - key: LOG_LEVEL
        value: info
